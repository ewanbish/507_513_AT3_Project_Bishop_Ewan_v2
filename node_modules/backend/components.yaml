components:
  schemas:
    Session:
      type: object
      required: [id, activity, trainer, location, date, startTime, endTime]
      properties:
        id:
          type: integer
          example: 1
        activity:
          type: string
          example: "Boxing"
        trainer:
          type: string
          example: "Tony Stark"
        location:
          type: string
          example: "West End"
        date:
          type: string
          format: date
          example: "2025-08-10"
        startTime:
          type: string
          format: time
          example: "10:00:00"
        endTime:
          type: string
          format: time
          example: "12:00:00"
    Booking:
      type: object
      required: [sessionId, userId]
      properties:
        id:
          type: number
          example: 1
        sessionId:
          type: number
          example: 1
        userId:
          type: number
          example: 1
    User:
      type: object
      required: [firstName, lastName, email, password, role]
      properties:
        id:
          type: number
          nullable: true
          example: 1
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Wick"
        email:
          type: string
          example: "Jwick@gmail.com"
        password:
          type: string
          example: "Password1*"
        role:
          type: string
          example: "trainer"
          enum: [member, trainer, admin]
        authenticationKey:
          type: string
          example: "[Insert key here]"
    Blog:
      type: object
      required: [id, postContent, postTitle]
      properties:
        id:
          type: number
          example: 1
        postContent:
          type: string
          example: "This is my super interesting content"
        postTitle:
          type: string
          example: "A Title!"
    UserCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: "John@gmail.com"
        password:
          type: string
          example: "Password1*"
    ApiKey:
      type: object
      required: [key]
      properties:
        key:
          type: string
          format: uuid
  responses:
    Created:
      description: "A new item was created"
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              id:
                type: number
                example: 1
              message:
                type: string
                example: "Item created"
    Not_Found:
      description: "The resource could not be found"
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
                example: "Not Found"
    Database_Error:
      description: "The server ran into an issue"
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
                example: "Database Error"
    Retrieved:
      description: "An object of resources has been retrieved from the database"
      content:
        application/json:
          schema:
            type: object
            example: {}
    Retrieved_Array:
      description: "An array of resources has been retrieved from the database"
      content:
        application/json:
          schema:
            type: array
            example: []
    Deleted:
      description: "The resource has been successfully deleted"
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
                example: "Resource Deleted"
    Updated:
      description: "The resource has been updated in the database"
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
                example: "Resource Updated"
    Forbidden:
      description: "User is not permitted to access this resource"
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
                example: "User role is not permitted to acess this resource"
    Not_Authenticated:
      description: "User is not authenticated to access this resource"
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
                example: "Login to access this resource"
    Authenticated:
      description: "User has been authenticated in the database"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiKey"
    Invalid_Credentials:
      description: "The user inputted Invalid Credentials"
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
                example: "Invalid Credentials"
    Generic_Error:
      description: "Something went wrong in the program"
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message:
                type: string
                example: "Something went wrong..."
